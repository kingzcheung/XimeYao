name: AppMetadataAutoUpdate

on:
  workflow_dispatch:
  push:
    paths:
      - "metadata/metadata.json"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Reconfigure store credentials
        shell: pwsh
        run: msstore reconfigure --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} --sellerId ${{ secrets.SELLER_ID }} --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - name: Update metadata
        shell: pwsh
        run: |
          $metadata = Get-Content -Raw "${{ github.workspace }}/metadata/metadata.json"
          msstore submission updateMetadata ${{ vars.STORE_PRODUCT_ID }} $metadata

      - name: Publish to Store
        shell: pwsh
        run: msstore submission publish ${{ vars.STORE_PRODUCT_ID }}
