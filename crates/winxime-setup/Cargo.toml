[package]
name = "winxime-setup"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "GPL-3.0"
repository.workspace = true

[dependencies]
# clipboard-page/backup-page/voice-page：剪贴板同步（插件）、云备份与语音转文本设置页
xime-setup-lib = { workspace = true, features = ["clipboard-page", "backup-page", "voice-page"] }
winxime-ipc.workspace = true
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

[[bin]]
name = "winxime-setup"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
