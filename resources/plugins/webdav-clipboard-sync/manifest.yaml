# =============================================
# Xime Lua 插件元数据（宿主用 YAML 解析）
# =============================================

# 插件唯一标识
id: com.kingzcheung.xime.plugin.webdav_clipboard_sync

# 插件名称与描述
name: WebDAV 剪贴板同步
icon: "☁️"
description: 通过 WebDAV 文件同步剪贴板（文本，多设备）,目前仅测试了坚果云盘的 WebDAV 接口。

# 插件版本（字符串）
version: 0.4.0

# 插件分类：clipboard_sync 剪贴板同步（单选激活）
type: clipboard_sync
activation: single

# 入口脚本
entry: main.lua

# 宿主最低版本要求
minHostVersion: 2.8.0

# 能力声明
capabilities:
  clipboard_sync:
    protocols:
      - webdav   # 通过 WebDAV 同步剪贴板（与 ximed WebDavTransport 协议一致）

# 网络访问声明：服务器地址由用户配置，域名不固定。
# allowCustomHosts: 接受用户填写的服务器地址域名，经配置后自动授权联网
network:
  hosts: []
  allowCustomHosts: true
